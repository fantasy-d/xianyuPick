[project]
name = "xianyu-tools"
version = "0.1.0"
description = "Tools for scanning Xianyu hot items and validating 1688 image-search sources."
requires-python = ">=3.11"
dependencies = [
    "scrapling>=0.4.8",
    "browserforge>=1.2.4",
    "patchright>=1.60.1",
    "msgspec>=0.21.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
