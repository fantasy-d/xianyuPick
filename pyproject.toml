[project]
name = "xianyu-tools"
version = "0.1.0"
description = "Tools for scanning Xianyu hot items and validating 1688 image-search sources."
requires-python = ">=3.11"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
